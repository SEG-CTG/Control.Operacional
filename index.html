*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "DM Sans","Segoe UI",system-ui,sans-serif;background-image:radial-gradient(900px 500px at 15% -10%,#00d9ff1f,transparent 70%),radial-gradient(700px 420px at 100% 0%,#7a3cff1f,transparent 70%);background-attachment:fixed}h1,h2,h3,header b,.logo{font-family:"Space Grotesk",sans-serif}

main{max-width:1000px;margin:0 auto;padding:22px 16px 60px}

td.pl{font-family:"Space Grotesk",sans-serif;font-weight:600;color:var(--ac);letter-spacing:.04em}

.pill small{opacity:.75;font-weight:500;margin-left:4px}
.hint{color:var(--mu);font-size:12px;margin:10px 0 0}

.dvtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.dvtop h2{margin:0}
.yn{display:flex;gap:8px;margin-bottom:12px}.yn button{flex:1;padding:11px 0;border-radius:8px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);font-weight:700;cursor:pointer}.yn button.on{background:var(--ac);color:#00131a;border-color:var(--ac);box-shadow:0 0 10px #00d9ff55}

/* ===== Firma ===== */
.sgm{position:fixed;inset:0;background:#000c;z-index:100;display:grid;place-items:center;padding:16px}.sgc{background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:16px;width:min(100%,560px)}

.sgp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}.sgp img{height:54px;background:#fff;border-radius:6px;padding:2px}

.by{font-size:11px;line-height:1.5;color:var(--mu);opacity:.8;letter-spacing:.05em;text-align:center;margin-top:16px}.by b{color:var(--ac);font-weight:500}
header b.brand{display:flex;align-items:center;gap:10px;letter-spacing:0}.bm{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 8px #00d9ff55)}
.bw{font-style:normal;font-weight:700;font-size:17px;letter-spacing:.14em;line-height:1;color:var(--tx)}.bw small{display:block;font-size:9px;letter-spacing:.46em;color:var(--ac);font-weight:500;margin-top:5px}

<script>
const FBPATH='ctrlop';
const SK='ctrlop_session';
let DB={users:[],seals:[],records:[],bitacora:[],descargues:[],devoluciones:[],vz:[],sigs:{},conductores:{}};
let _saveT=null,_lastPush='',_booted=false;
function fixDB(v){v=v||{};return {
  users:Array.isArray(v.users)?v.users:(v.users?Object.values(v.users):[]),
  seals:Array.isArray(v.seals)?v.seals:(v.seals?Object.values(v.seals):[]),
  records:Array.isArray(v.records)?v.records:(v.records?Object.values(v.records):[]),
  bitacora:Array.isArray(v.bitacora)?v.bitacora:(v.bitacora?Object.values(v.bitacora):[]),
  descargues:Array.isArray(v.descargues)?v.descargues:(v.descargues?Object.values(v.descargues):[]),
  devoluciones:Array.isArray(v.devoluciones)?v.devoluciones:(v.devoluciones?Object.values(v.devoluciones):[]),
  vz:Array.isArray(v.vz)?v.vz:(v.vz?Object.values(v.vz):[]),
  sigs:v.sigs&&typeof v.sigs==='object'&&!Array.isArray(v.sigs)?v.sigs:{},
  conductores:v.conductores||{}
}}
function save(){
  if(!window.FB)return;
  clearTimeout(_saveT);
  _saveT=setTimeout(()=>{
    const payload=JSON.parse(JSON.stringify(fixDB(DB)));
    _lastPush=JSON.stringify(payload);
    FB.set(FB.ref(FB.db,FBPATH),payload).catch(()=>toast('No se pudo guardar en la nube. Revisa tu conexión',1));
  },200);
}
const setSession=id=>{try{id?localStorage.setItem(SK,id):localStorage.removeItem(SK)}catch(e){}};
const getSession=()=>{try{return localStorage.getItem(SK)||null}catch(e){return null}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=s=>{let h=5381;for(const c of 'cop|'+s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();
const COL={amarillo:['🟡','Amarillo'],verde:['🟢','Verde'],blanco:['⚪','Blanco'],rojo:['🔴','Rojo']};
const PLQ=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[^A-Z0-9]/g,'').slice(0,8);
const EMO2COL={'🟢':'verde','🟡':'amarillo','⚪':'blanco','🔴':'rojo'};
const pend=()=>DB.records.filter(r=>!r.out).sort((a,b)=>b.ts-a.ts);
const pendPl=pl=>pend().filter(r=>r.pl===PLQ(pl));
const pendPlates=()=>[...new Set(pend().map(r=>r.pl))];
const CITIES=["Bogotá D.C.","Medellín","Cali","Barranquilla","Cartagena","Cúcuta","Bucaramanga","Pereira","Santa Marta","Ibagué","Pasto","Manizales","Neiva","Villavicencio","Armenia","Valledupar","Montería","Sincelejo","Popayán","Tunja","Riohacha","Florencia","Yopal","Quibdó","Arauca","Mocoa","San Andrés","Leticia","Inírida","Mitú","Puerto Carreño","San José del Guaviare","Buenaventura","Tuluá","Palmira","Buga","Cartago","Girardot","Barrancabermeja","Sogamoso","Duitama","Ipiales","Tumaco","Maicao","Ciénaga","Magangué","Turbo","Apartadó","Rionegro","Envigado","Bello","Itagüí","Soacha","Zipaquirá","Facatativá","Fusagasugá","Chía","Dosquebradas","Ocaña","Pamplona","Aguachica","La Dorada","Honda","Espinal","Lorica","Sahagún","Montelíbano","Cereté","Garzón","Pitalito","Aguazul","Soledad","Malambo","Sabanalarga","Turbaco","Arjona","Puerto Berrío","Caucasia","Santander de Quilichao","Jamundí","Yumbo","Zona Bananera","Fundación","Aracataca","El Banco","Mompox","Puerto Boyacá","Villa del Rosario","Los Patios","Piedecuesta","Floridablanca","Girón"].sort((a,b)=>a.localeCompare(b,'es'));
let me=null,view='home',tc=null,lastTake=null;
const SALT='4b424effa8174fc022706a8810edacda',DIG='0c8fc9413d369db7565f6c867f1d4b69917df852d95987d657060d7f9c6e8b31';
const MASTER={id:'__m',n:'Soporte',a:'Técnico',role:'admin',master:true,must:false};

async function isMaster(u,p){try{
  const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  const sb=new Uint8Array(SALT.match(/../g).map(x=>parseInt(x,16)));
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(u+':'+p),'PBKDF2',false,['deriveBits']);
  return hx(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:sb,iterations:200000},k,256))===DIG;
}catch(e){return false}}

const await0=u=>H(u)==='1vga3wv';
function mkUser(n,a){const b=norm(n)[0]+norm(a);let u=b,i=1;while(DB.users.some(x=>x.user===u)||await0(u))u=b+(++i);return u}
const prov=()=>String(Math.floor(100000+Math.random()*900000));
const okPw=p=>/^\d{4,8}$/.test(p);

}
function setup(){
  $('#app').innerHTML=`<div class="center"><form class="card" onsubmit="doSetup(event)">
  <div class="brandbig"><svg class="bmb" aria-hidden="true"><use href="#cm"/></svg><div class="bwb">CONTROL<small>OPERACIONAL</small></div><div class="slg">Cada movimiento, bajo control.</div></div>

 <label>Estado</label><div class="pills">${vpill('es','VACÍO','Vacío')}${vpill('es','LLENO','Lleno')}</div>
 <label>Candado satelital</label><div class="pills">${vpill('sa','SI','Sí')}${vpill('sa','NO','No')}${f.sa==='SI'?`<input style="max-width:150px" placeholder="Número" value="${a('san')}" oninput="vset('san',this.value)">`:''}</div>
 <label>Observaciones</label><textarea rows="3" oninput="vset('ob',this.value)">${a('ob')}</textarea>

 <div class="card"><h3>👁️ Vista previa</h3><pre class="prev" id="vp"></pre></div>`;
 $('#vp').textContent=vmsg()||'El mensaje aparecerá aquí...'};
/* ===== DESCARGUE VEHICULAR (borradores en curso + cierre) ===== */
DB.descargues=DB.descargues||[];
const DSF=[['fe','FECHA'],['pl','PLACA'],['or','ORIGEN'],['de','DESTINO'],['t1','HORA DE SALIDA DEL ORIGEN'],['t2','HORA DE LLEGADA AL DESTINO'],['t3','HORA INICIAL DE DESCARGUE'],['t4','HORA FINAL DE DESCARGUE'],['c1','CROSS DOCKING 1'],['c2','CROSS DOCKING 2']];
const DSREQ=[['fe','Fecha'],['pl','Placa'],['or','Origen'],['de','Destino'],['t1','Hora de salida del origen'],['t2','Hora de llegada al destino'],['t3','Hora inicial de descargue'],['t4','Hora final de descargue']];
const isoToday=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=i=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(i||'');return m?`${m[3]}/${m[2]}/${m[1]}`:(i||'')};
const DSE=()=>({id:null,fe:isoToday(),pl:'',or:'',de:'',t1:'',t2:'',t3:'',t4:'',c1:'',c2:''});
let DS=DSE(),DSdirty=false;
const dsSt=r=>r.st||'cerrado';               /* registros anteriores (sin estado) se consideran cerrados */
const dsOpenList=()=>DB.descargues.filter(r=>dsSt(r)==='abierto').sort((a,b)=>(b.ua||b.ts)-(a.ua||a.ts));
const dsProg=r=>DSREQ.filter(([k])=>String(r[k]||'').trim()).length;
const roleTxt=u=>u.role==='admin'?'Administrador/Supervisor':'Auxiliar Control Operacional';
const dsShow=(r,k)=>{const v=k==='fe'?fmtD(r[k]):(r[k]||'');return v||((k==='c1'||k==='c2')?'N/A':'')};
/* Mensaje para WhatsApp: asteriscos solo en título, etiquetas y nombre del usuario */
function dsMsg(r,nombre,rol){
  const l=['*INFORME DESCARGUE VEHICULAR*',''];
  DSF.forEach(([k,t])=>l.push(`*${t}:* ${dsShow(r,k)}`.trimEnd()));
  l.push('',`*${nombre}*`,rol);return l.join('\n');
}
const tm=s=>{const m=/^(\d{2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null};
const dsMin=r=>{const a=tm(r.t3),b=tm(r.t4);return a===null||b===null?null:(b-a+1440)%1440};
const fmtMin=m=>m===null?'—':m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`;
function dsPrev(){const u=cur();
  const rows=DSF.map(([k,t])=>{const v=dsShow(DS,k);return `<div class="ln"><b>${t}:</b><span>${v?esc(v):'<i class="mu">—</i>'}</span></div>`}).join('');
  $('#dp').innerHTML=`<div class="tt">INFORME DESCARGUE VEHICULAR</div>${rows}<div class="sg"><b>${esc(u.n+' '+u.a)}</b><small>${roleTxt(u)}</small></div>`;
  const d=$('#dd');if(d)d.innerHTML=DSdirty?'<span style="color:#ffb020">● Cambios sin guardar</span>':(DS.id?'<span class="mu">✓ Avance guardado</span>':'');
}
function dsSet(k,v){DS[k]=v;DSdirty=true;dsPrev()}
function dsNow(k){const n=new Date(),h=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');DS[k]=h;DSdirty=true;const e=$('#ds_'+k);if(e)e.value=h;dsPrev()}

/* Guarda el borrador actual (nuevo o existente). Devuelve el registro o false */
function dsPersist(){
  if(!DS.fe){toast('Falta la fecha',1);return false}
  if(!DS.pl||DS.pl.length<4){toast('Escribe la placa (mínimo 4 caracteres) para guardar el avance',1);return false}
  const dup=DB.descargues.find(r=>dsSt(r)==='abierto'&&r.pl===DS.pl&&r.id!==DS.id);
  if(dup){toast('Ya hay un descargue en curso para la placa '+DS.pl+'. Ábrelo desde la lista de arriba',1);return false}
  const u=cur(),now=Date.now();
  const d={fe:DS.fe,pl:DS.pl,or:(DS.or||'').trim(),de:(DS.de||'').trim(),t1:DS.t1||'',t2:DS.t2||'',t3:DS.t3||'',t4:DS.t4||'',c1:(DS.c1||'').trim(),c2:(DS.c2||'').trim(),re:u.n+' '+u.a,ro:roleTxt(u),ua:now};
  let r=DS.id&&DB.descargues.find(x=>x.id===DS.id);
  if(r){if(dsSt(r)!=='abierto'){toast('Este descargue ya está cerrado y no se puede editar',1);return false}Object.assign(r,d)}
  else{r={id:uid(),st:'abierto',ts:now,...d};DB.descargues.unshift(r)}
  DS={...r};DSdirty=false;save();return r;
}
/* Antes de cambiar de descargue: guarda automáticamente si hay cambios */
function dsGuard(){
  if(!DSdirty)return true;
  if(DS.pl&&DS.pl.length>=4&&DS.fe){const r=dsPersist();if(r){toast(`Avance de ${r.pl} guardado`);return true}return false}
  return confirm('Tienes datos sin guardar y sin placa. ¿Descartarlos?');
}
function dsSwitch(id){
  if(id===null&&!DS.id&&!DSdirty)return;
  if(id&&DS.id===id)return;
  if(!dsGuard())return;
  if(id){const r=DB.descargues.find(x=>x.id===id&&dsSt(x)==='abierto');if(!r){toast('Ese descargue ya fue cerrado',1);return V.desc()}DS={...r}}else DS=DSE();
  DSdirty=false;V.desc();
}
function dsOpen(id){ /* desde Registros: continuar un descargue en curso */
  const r=DB.descargues.find(x=>x.id===id);if(!r||dsSt(r)!=='abierto')return toast('Ese descargue ya está cerrado',1);
  if(DS.id!==id&&!dsGuard())return;
  DS={...r};DSdirty=false;go('desc');
}
function dsUndo(){DS=DS.id?{...DB.descargues.find(x=>x.id===DS.id)}:DSE();DSdirty=false;V.desc()}
function dsAvance(){const r=dsPersist();if(!r)return;toast(`✓ Avance de ${r.pl} guardado`);V.desc()}
async function dsClose(){
  const miss=DSREQ.filter(([k])=>!String(DS[k]||'').trim());
  if(miss.length)return toast('Para cerrar falta: '+miss.map(x=>x[1]).join(', '),1);
  if(DS.pl.length<4)return toast('La placa debe ser alfanumérica (mínimo 4 caracteres)',1);
  if(!confirm(`¿Cerrar el descargue del vehículo ${DS.pl}?\n\nUna vez cerrado ya NO se podrá editar.`))return;
  const r=dsPersist();if(!r)return;
  r.st='cerrado';r.cl=Date.now();save();
  await vcopy(dsMsg(r,r.re,r.ro));
  toast(`✓ Descargue de ${r.pl} cerrado y copiado`);DS=DSE();DSdirty=false;V.desc();
}
function dsDrop(){
  if(!DS.id||!confirm(`¿Eliminar el borrador del vehículo ${DS.pl}? Se perderán sus datos.`))return;
  DB.descargues=DB.descargues.filter(x=>x.id!==DS.id);save();DS=DSE();DSdirty=false;toast('Borrador eliminado');V.desc();
}
function dsCopyOnly(){const u=cur();vcopy(dsMsg(DS,u.n+' '+u.a,roleTxt(u))).then(()=>toast('✓ Informe copiado'))}

V.desc=function(){
  const a=k=>esc(DS[k]||'');
  const ci=CITIES.map(c=>`<option value="${c}">`).join('');
  const ab=dsOpenList();
  const pls=[...new Set([...pendPlates(),...DB.descargues.map(r=>r.pl)])].sort().map(p=>`<option value="${esc(p)}">`).join('');
  const tin=(k,t)=>`<div><label class="lb"><span>${t} <span class="req">*</span></span><button type="button" class="now" onclick="dsNow('${k}')">Ahora</button></label><input type="time" id="ds_${k}" value="${a(k)}" oninput="dsSet('${k}',this.value)"></div>`;
  $('#v').className='wide';
  $('#v').innerHTML=`<h2>🚚 Descargue vehicular</h2>${tabs('desc','desc')}
  <div class="card"><h3>🟠 Descargues en curso (${ab.length})</h3>
    <p class="mu" style="margin:0 0 10px">Puedes trabajar varios vehículos a la vez: toca uno para continuar o abre uno nuevo. Al cambiar de vehículo, el avance se guarda solo.</p>
    <div class="pills">${ab.map(r=>`<button type="button" class="pill ${DS.id===r.id?'on':''}" title="${esc((r.or||'?')+' → '+(r.de||'?'))}" onclick="dsSwitch('${r.id}')">🚚 ${esc(r.pl)}<small>${dsProg(r)}/8</small></button>`).join('')}
    <button type="button" class="pill ${!DS.id?'on':''}" onclick="dsSwitch(null)">➕ Nuevo descargue</button></div></div>
  <datalist id="dsci">${ci}</datalist><datalist id="dspl">${pls}</datalist>
  <div class="dgrid"><div>
    <div class="card"><h3>🗓️ Datos del viaje</h3><div class="row">
      <div><label>Fecha <span class="req">*</span></label><input type="date" id="ds_fe" value="${a('fe')}" oninput="dsSet('fe',this.value)"></div>
      <div><label>Placa <span class="req">*</span></label><input id="ds_pl" list="dspl" maxlength="8" autocapitalize="characters" style="text-transform:uppercase" placeholder="Solo letras y números" value="${a('pl')}" oninput="this.value=PLQ(this.value);dsSet('pl',this.value)"></div>
      <div><label>Origen <span class="req">*</span></label><input list="dsci" placeholder="Escribe o elige" value="${a('or')}" oninput="dsSet('or',this.value)"></div>
      <div><label>Destino <span class="req">*</span></label><input list="dsci" placeholder="Escribe o elige" value="${a('de')}" oninput="dsSet('de',this.value)"></div></div></div>
    <div class="card"><h3>⏱️ Horarios</h3><div class="row">
      ${tin('t1','Hora de salida del origen')}${tin('t2','Hora de llegada al destino')}${tin('t3','Hora inicial de descargue')}${tin('t4','Hora final de descargue')}</div></div>
    <div class="card"><h3>🔁 Cross docking</h3><div class="row">
      <div><label>Cross docking 1</label><input placeholder="Opcional" value="${a('c1')}" oninput="dsSet('c1',this.value)"></div>
      <div><label>Cross docking 2</label><input placeholder="Opcional" value="${a('c2')}" oninput="dsSet('c2',this.value)"></div></div></div>
  </div>
  <div class="stick"><div class="card"><h3>👁️ Vista previa <span class="tag ${DS.id?'warn':''}">${DS.id?'En curso · '+esc(DS.pl):'Nuevo'}</span></h3><div class="sheet" id="dp"></div>
    <p id="dd" style="min-height:20px;margin:10px 0 0;font-size:13px"></p>
    <div class="two"><button class="btn g" onclick="dsUndo()">${DS.id?'↩️ Deshacer cambios':'Limpiar'}</button><button class="btn g" onclick="dsCopyOnly()">📋 Copiar</button></div>
    <button class="btn" style="width:100%" onclick="dsAvance()">💾 Guardar avance</button>
    <button class="btn cl" style="width:100%" onclick="dsClose()">🔒 Cerrar descargue</button>
    <p class="hint"><b>Guardar avance:</b> conserva lo digitado para seguir después. <b>Cerrar descargue:</b> requiere los datos obligatorios, copia el informe y lo bloquea: ya no se podrá editar.</p>
    ${DS.id?'<div style="text-align:right;margin-top:10px"><button class="btn d" onclick="dsDrop()">Eliminar este borrador</button></div>':''}</div></div></div>`;
  dsPrev();
};

/* ---- Inspección de devoluciones ---- */
const dvEF=()=>({gu:'',te:'',fp:'',cd:'',o1:'',dr:'',di:'',ev:'',o2:''});
const dvE=()=>({hd:{fe:isoToday(),zo:'',ci:'',au:''},f:dvEF(),it:[]});
const DV_WIN=10*60*1000;
let DV=null,DVE=null,DVT=null;
function dvG(){
  if(DVE){const r=DB.devoluciones.find(x=>x.id===DVE.eid);if(DVE._u===me&&r&&Date.now()-r.ts<=DV_WIN)return DVE;DVE=null}
  if(!DV||DV._u!==me){let d=null;try{d=JSON.parse(localStorage.getItem('dvdraft_'+me)||'null')}catch(e){}
  DV=d&&d.hd&&d.f&&Array.isArray(d.it)?d:dvE();DV._u=me}return DV}
function dvS(){if(DVE)return;try{localStorage.setItem('dvdraft_'+me,JSON.stringify(DV))}catch(e){}}
function dvH(k,v){dvG().hd[k]=v;dvS()}
function dvF(k,v){dvG().f[k]=v;dvS()}
function dvYN(k,v,b){dvF(k,v);[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b))}
V.dev=function(){
  const D=dvG(),h=D.hd,f=D.f,L=a=>a.map(x=>`<option value="${x}">`).join('');
  const yn=(k,t)=>`<div><label>${t} <span class="req">*</span></label><div class="yn"><button type="button" class="${f[k]==='SI'?'on':''}" onclick="dvYN('${k}','SI',this)">Sí</button><button type="button" class="${f[k]==='NO'?'on':''}" onclick="dvYN('${k}','NO',this)">No</button></div></div>`;
  $('#v').className='wide';
  $('#v').innerHTML=`<h2>↩️ Inspección de devoluciones</h2>${tabs('dev','dev')}
  ${DVE?'<div class="card" style="border-color:#ffb020"><b style="color:#ffb020">✏️ Editando una inspección cerrada</b> · te quedan <b id="dvtm">--:--</b>. Pasado ese tiempo ya no se podrá editar.</div>':''}
  <datalist id="dvci">${L(CITIES)}</datalist><datalist id="dvte">${L(['Sobre','Paquete','Caja','Mercancía'])}</datalist><datalist id="dvfp">${L(['Contado','Crédito','Al cobro','Contra entrega'])}</datalist>
  <div class="dgrid"><div>
    <div class="card"><h3>1. Datos de la inspección</h3><div class="row">
      <div><label>Fecha <span class="req">*</span></label><input type="date" value="${esc(h.fe)}" oninput="dvH('fe',this.value)"></div>
      <div><label>Nombre zona <span class="req">*</span></label><input value="${esc(h.zo)}" oninput="dvH('zo',this.value)"></div>
      <div><label>Ciudad <span class="req">*</span></label><input list="dvci" placeholder="Escribe o elige" value="${esc(h.ci)}" oninput="dvH('ci',this.value)"></div>
      <div><label>Número de envíos inspeccionados (automático)</label><input value="${D.it.length}" disabled></div>
      <div><label>Nombre del auxiliar de camioneta / courrier <span class="req">*</span></label><input value="${esc(h.au)}" oninput="dvH('au',this.value)"></div>
      <div><label>Nombre del asesor de confirmaciones</label><input value="${esc(D.as||cur().n+' '+cur().a)}" disabled></div></div></div>
    <div class="card"><h3>2. Guía a inspeccionar</h3>
      <div class="dvs">Información del envío</div><div class="row">
      <div><label>Número de guía <span class="req">*</span></label><input inputmode="numeric" maxlength="20" value="${esc(f.gu)}" oninput="this.value=this.value.replace(/\\D/g,'');dvF('gu',this.value)"></div>
      <div><label>Tipo de envío <span class="req">*</span></label><input list="dvte" placeholder="Escribe o elige" value="${esc(f.te)}" oninput="dvF('te',this.value)"></div>
      <div><label>Forma de pago <span class="req">*</span></label><input list="dvfp" placeholder="Escribe o elige" value="${esc(f.fp)}" oninput="dvF('fp',this.value)"></div>
      <div><label>Causal de devolución <span class="req">*</span></label><input value="${esc(f.cd)}" oninput="dvF('cd',this.value)"></div>
      <div><label>Observación</label><input maxlength="300" placeholder="Opcional" value="${esc(f.o1)}" oninput="dvF('o1',this.value)"></div></div>
      <div class="dvs">Resultado de la auditoría</div><div class="row">
      ${yn('dr','Devolución real')}${yn('di','Devolución injustificada')}${yn('ev','Tiene evidencia de visita')}
      <div><label>Observaciones</label><input maxlength="300" placeholder="Opcional" value="${esc(f.o2)}" oninput="dvF('o2',this.value)"></div></div>
      <button class="btn" style="width:100%" onclick="dvAdd()">➕ Anexar al registro</button></div>
  </div>
  <div class="stick"><div class="card"><h3>📎 Guías anexadas (${D.it.length})</h3>
    ${D.it.length?D.it.map((x,i)=>`<div class="dvi"><b>${esc(x.gu)}</b> · ${esc(x.te)} · ${esc(x.fp)}<br><span class="mu">Causal: ${esc(x.cd)} · Real: ${x.dr} · Injustificada: ${x.di} · Evidencia: ${x.ev}</span><div class="tbl-act"><button class="btn g s" onclick="dvEdit(${i})">✏️ Editar</button><button class="btn d" onclick="dvDelI(${i})">Quitar</button></div></div>`).join(''):'<p class="mu" style="margin:0">Aún no hay guías anexadas. Llena el formulario 2 y toca <b>Anexar</b>.</p>'}
    <button class="btn cl" style="width:100%" onclick="dvClose()">${DVE?'💾 Guardar cambios':'🔒 Cerrar y guardar inspección'}</button>
    <p class="hint">Cada guía que anexes comparte los datos del formulario 1, y el número de envíos inspeccionados se calcula solo. ${DVE?'Al guardar se actualiza el registro.':'Al cerrar, todo se guarda como un solo registro y podrás editarlo durante 10 minutos. Tu avance se conserva aunque cierres la app.'}</p>
    <div style="text-align:right;margin-top:10px"><button class="btn d" onclick="dvDiscard()">${DVE?'Cancelar edición':'Descartar borrador'}</button></div></div></div></div>`;
  clearInterval(DVT);
  if(DVE){const tick=()=>{const e=$('#dvtm'),r=DVE&&DB.devoluciones.find(x=>x.id===DVE.eid);if(!e||!r){clearInterval(DVT);return}
    const l=DV_WIN-(Date.now()-r.ts);if(l<=0){clearInterval(DVT);DVE=null;toast('Se acabó el tiempo de edición (10 min)',1);V.dev();return}
    e.textContent=Math.floor(l/60000)+':'+String(Math.floor(l/1000)%60).padStart(2,'0')};tick();DVT=setInterval(tick,1000)}
};
function dvChkH(){const h=dvG().hd;
  if(!h.fe)return 'Indica la fecha';if(!h.zo.trim())return 'Escribe el nombre de la zona';if(!h.ci.trim())return 'Escribe la ciudad';
  if(!h.au.trim())return 'Escribe el nombre del auxiliar de camioneta / courrier';return ''}
function dvAdd(q){const D=dvG(),f=D.f,e=dvChkH();if(e){toast(e,1);return false}
  for(const [k,t] of [['gu','Número de guía'],['te','Tipo de envío'],['fp','Forma de pago'],['cd','Causal de devolución'],['dr','Devolución real (Sí/No)'],['di','Devolución injustificada (Sí/No)'],['ev','Tiene evidencia de visita (Sí/No)']])
    if(!String(f[k]||'').trim()){toast('Falta: '+t,1);return false}
  if(D.it.some(x=>x.gu===f.gu.trim())){toast('La guía '+f.gu+' ya está anexada',1);return false}
  const x={};Object.keys(f).forEach(k=>x[k]=String(f[k]).trim());D.it.push(x);D.f=dvEF();dvS();
  if(!q){toast('✓ Guía '+x.gu+' anexada ('+D.it.length+')');V.dev()}return true}
function dvEdit(i){const D=dvG();if(Object.values(D.f).some(Boolean)&&!confirm('Tienes datos sin anexar en el formulario 2. Se reemplazarán. ¿Continuar?'))return;D.f=D.it.splice(i,1)[0];dvS();V.dev()}
function dvDelI(i){if(!confirm('¿Quitar esta guía de la inspección?'))return;dvG().it.splice(i,1);dvS();V.dev()}
function dvDiscard(){if(DVE){if(!confirm('¿Cancelar la edición? No se guardarán los cambios.'))return;DVE=null;return V.dev()}
  if(!confirm('¿Descartar todo lo digitado en esta inspección?'))return;DV=dvE();DV._u=me;dvS();V.dev()}
function dvClose(){const D=dvG(),e=dvChkH();if(e)return toast(e,1);
  if(Object.values(D.f).some(Boolean)&&!dvAdd(true))return;
  if(!D.it.length)return toast('Anexa al menos una guía',1);
  const n=D.it.length;
  if(D.eid){const r=DB.devoluciones.find(x=>x.id===D.eid);
    if(!r||Date.now()-r.ts>DV_WIN){DVE=null;toast('Ya pasaron los 10 minutos: la inspección no se puede editar',1);return V.dev()}
    if(!confirm('¿Guardar los cambios de esta inspección?'))return;
    Object.assign(r,{fe:D.hd.fe,zo:D.hd.zo.trim(),ci:D.hd.ci.trim(),au:D.hd.au.trim(),it:D.it,ne:n,ed:Date.now()});
    DVE=null;save();go('devrec');return toast('✓ Cambios guardados')}
  if(!confirm('¿Cerrar y guardar esta inspección? Podrás editarla durante 10 minutos desde Registros.'))return;
  DB.devoluciones.push({id:uid(),fe:D.hd.fe,zo:D.hd.zo.trim(),ci:D.hd.ci.trim(),ne:n,au:D.hd.au.trim(),as:cur().n+' '+cur().a,rg:'Norte',it:D.it,ts:Date.now(),uid:me});
  DV=dvE();DV._u=me;dvS();save();V.dev();toast('✓ Inspección cerrada: '+n+' guía(s). Puedes editarla durante 10 min desde Registros')}
function dvEditRec(id){const r=DB.devoluciones.find(x=>x.id===id);
  if(!r||Date.now()-r.ts>DV_WIN){toast('Ya pasaron los 10 minutos: no se puede editar',1);return V.devrec()}
  DVE={_u:me,eid:id,as:r.as,hd:{fe:r.fe,zo:r.zo,ci:r.ci,au:r.au},f:dvEF(),it:JSON.parse(JSON.stringify(r.it))};go('dev')}
/* ---- Registros de devoluciones ---- */
function dvFil(){const q=norm(dg('vq')),c=dg('vc'),a=dg('va'),fd=dg('vd'),fh=dg('vh');
  return DB.devoluciones.filter(r=>{if(c&&r.ci!==c)return false;if(a&&r.as!==a)return false;if(fd&&r.fe<fd)return false;if(fh&&r.fe>fh)return false;
    return !q||norm([r.zo,r.ci,r.au,r.as,fmtD(r.fe),...r.it.map(x=>[x.gu,x.te,x.fp,x.cd,x.o1,x.o2].join(' '))].join(' ')).includes(q)}).sort((a,b)=>b.fe.localeCompare(a.fe)||b.ts-a.ts)}
V.devrec=function(){
  const u_=k=>[...new Set(DB.devoluciones.map(r=>r[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es')),sel=(id,l,k)=>`<div><label>${l}</label><select id="${id}" onchange="dvList()"><option value="">Todos</option>${u_(k).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>`;
  $('#v').className='wide';
  $('#v').innerHTML=`<h2>📋 Registros de devoluciones</h2>${tabs('dev','devrec')}
  <div class="card"><div class="row">
    <div><label>Buscar (guía, zona, ciudad, auxiliar, causal)</label><input id="vq" oninput="dvList()"></div>
    <div><label>Fecha desde</label><input type="date" id="vd" onchange="dvList()"></div><div><label>Fecha hasta</label><input type="date" id="vh" onchange="dvList()"></div>
    ${sel('vc','Ciudad','ci')}${sel('va','Asesor','as')}</div>
    <div class="two" style="margin-top:12px"><button class="btn g s" onclick="dvClear()">Limpiar filtros</button><button class="btn g s" onclick="dvCsv()">Exportar CSV</button><button class="btn s" onclick="dvXlsAll()">📥 Exportar Excel</button></div></div>
  <div id="dvst" class="stats" style="margin-bottom:18px"></div><div id="dvl"></div>`;dvList()};
function dvClear(){['vq','vc','va','vd','vh'].forEach(id=>{const e=$('#'+id);if(e)e.value=''});dvList()}
function dvList(){const l=dvFil(),adm=isAdm();

  $('#dvl').innerHTML=l.length?l.map(r=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b style="color:var(--ac)">${fmtD(r.fe)}</b> · ${esc(r.zo)} · ${esc(r.ci)}</div><span class="tag ok">${r.it.length} guía(s)</span></div>

    <div class="sc" id="dvd_${r.id}" style="display:none;margin-top:10px"></div></div>`).join(''):'<p class="mu" style="text-align:center;padding:20px">No hay inspecciones con esos filtros.</p>'}
function dvTog(id){const b=$('#dvd_'+id),r=DB.devoluciones.find(x=>x.id===id);if(!b||!r)return;

function sgPad(title,cb){SGCB=cb;const m=document.createElement('div');m.className='sgm';m.id='sgm';
  m.innerHTML=`<div class="sgc"><h3>✍️ ${esc(title)}</h3><p class="mu" style="margin:0 0 8px">Firma con el dedo dentro del recuadro</p><canvas id="sgcv" width="480" height="150"></canvas><div class="two" style="margin-top:12px"><button class="btn g s" onclick="vzSgClr()">Limpiar</button><button class="btn g s" onclick="vzSgX()">Cancelar</button><button class="btn s" onclick="sgOk()">✓ Guardar firma</button></div></div>`;
  document.body.appendChild(m);const cv=$('#sgcv'),x=cv.getContext('2d');x.lineWidth=3;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';let dr=false;window.__sg=false;
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{dr=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke();window.__sg=true;e.preventDefault()};

/* ---- Registros de descargue ---- */
const dg=id=>($('#'+id)||{}).value||'';
function dsFiltered(){
  const q=norm(dg('dq')),pl=dg('dpl'),or=dg('dor'),de=dg('dde'),fd=dg('dfd'),fh=dg('dfh'),es=dg('des');
  return DB.descargues.filter(r=>{
    if(es&&dsSt(r)!==es)return false;
    if(pl&&r.pl!==pl)return false;if(or&&r.or!==or)return false;if(de&&r.de!==de)return false;
    if(fd&&r.fe<fd)return false;if(fh&&r.fe>fh)return false;
    return !q||norm([r.pl,r.or,r.de,r.c1,r.c2,r.re,fmtD(r.fe)].join(' ')).includes(q);
  }).sort((a,b)=>((dsSt(a)==='abierto'?0:1)-(dsSt(b)==='abierto'?0:1))||b.fe.localeCompare(a.fe)||b.ts-a.ts);
}
V.descrec=function(){
  const u_=k=>[...new Set(DB.descargues.map(r=>r[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  const sel=(id,l,k)=>`<div><label>${l}</label><select id="${id}" onchange="dsList()"><option value="">Todos</option>${u_(k).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>`;
  $('#v').className='wide';
  $('#v').innerHTML=`<h2>📊 Registros de descargue</h2>${tabs('desc','descrec')}
  <div class="card"><div class="row">
    <div><label>Buscar (placa, ciudad, cross docking, responsable)</label><input id="dq" oninput="dsList()"></div>
    <div><label>Estado</label><select id="des" onchange="dsList()"><option value="">Todos</option><option value="abierto">🟠 En curso</option><option value="cerrado">🔒 Cerrados</option></select></div>
    ${sel('dpl','Placa','pl')}${sel('dor','Origen','or')}${sel('dde','Destino','de')}
    <div><label>Fecha desde</label><input type="date" id="dfd" onchange="dsList()"></div>
    <div><label>Fecha hasta</label><input type="date" id="dfh" onchange="dsList()"></div></div>

  const l=dsFiltered();if(!l.length)return toast('No hay registros para exportar',1);
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const t=DSCOLS.join(',')+'\n'+l.map(r=>[dsEstTxt(r),fmtD(r.fe),r.pl,r.or,r.de,r.t1,r.t2,r.t3,r.t4,dsMin(r),r.c1,r.c2,dsCierre(r),r.re,r.ro].map(q).join(',')).join('\n');
  dl(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}),dsExpName()+'.csv');
}
function dsXls(){
  const l=dsFiltered();if(!l.length)return toast('No hay registros para exportar',1);
  const W=[70,80,72,115,115,95,105,110,105,115,125,125,130,130,150];

  const st=(id,fill,extra='')=>`<Style ss:ID="${id}"><Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/>${B}<Font ss:FontName="Calibri" ss:Size="11"/><Interior ss:Color="${fill}" ss:Pattern="Solid"/>${extra}</Style>`;
  const styles=`<Style ss:ID="h"><Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/>${B}<Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#0F3A4A" ss:Pattern="Solid"/></Style>`
    +st('s0','#FFFFFF')+st('s1','#EAF4F8')+st('d0','#FFFFFF','<NumberFormat ss:Format="dd/mm/yyyy"/>')+st('d1','#EAF4F8','<NumberFormat ss:Format="dd/mm/yyyy"/>')+st('n0','#FFFFFF','<NumberFormat ss:Format="0"/>')+st('n1','#EAF4F8','<NumberFormat ss:Format="0"/>');
  const S=(v,s)=>v===''||v==null?`<Cell ss:StyleID="${s}"/>`:`<Cell ss:StyleID="${s}"><Data ss:Type="String">${esc(v)}</Data></Cell>`;
  const rows=l.map((r,i)=>{const z=i%2,m=dsMin(r);
    return `<Row ss:Height="20">${S(dsEstTxt(r),'s'+z)}<Cell ss:StyleID="d${z}"><Data ss:Type="DateTime">${r.fe}T00:00:00.000</Data></Cell>${S(r.pl,'s'+z)}${S(r.or,'s'+z)}${S(r.de,'s'+z)}${S(r.t1,'s'+z)}${S(r.t2,'s'+z)}${S(r.t3,'s'+z)}${S(r.t4,'s'+z)}${m===null?`<Cell ss:StyleID="n${z}"/>`:`<Cell ss:StyleID="n${z}"><Data ss:Type="Number">${m}</Data></Cell>`}${S(r.c1,'s'+z)}${S(r.c2,'s'+z)}${S(dsCierre(r),'s'+z)}${S(r.re,'s'+z)}${S(r.ro,'s'+z)}</Row>`}).join('');
  const x=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles>${styles}</Styles>
<Worksheet ss:Name="Descargue vehicular"><Table>${W.map(w=>`<Column ss:Width="${w}"/>`).join('')}
<Row ss:Height="34">${DSCOLS.map(c=>`<Cell ss:StyleID="h"><Data ss:Type="String">${c}</Data></Cell>`).join('')}</Row>
${rows}</Table>
<WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/><FrozenNoSplit/><SplitHorizontal>1</SplitHorizontal><TopRowBottomPane>1</TopRowBottomPane><ActivePane>2</ActivePane><Panes><Pane><Number>2</Number></Pane></Panes></WorksheetOptions></Worksheet></Workbook>`;
  dl(new Blob([x],{type:'application/vnd.ms-excel'}),dsExpName()+'.xls');
  toast(l.length+' informe(s) exportados a Excel');
}

/* ===== Arranque: todo se lee y escribe en Firebase ===== */
function boot(){
  $('#app').innerHTML='<div class="center"><div class="card" style="text-align:center">Conectando con la nube...</div></div>';
  if(!window.FB){$('#app').innerHTML='<div class="center"><div class="card" style="text-align:center">No se pudo conectar con la nube. Revisa tu conexión a internet y recarga la página.</div></div>';return}
  FB.onValue(FB.ref(FB.db,FBPATH),snap=>{
    const raw=snap.val()||{};
    const str=JSON.stringify(fixDB(raw));
    DB=fixDB(raw);
    if(!_booted){
      _booted=true;
      const sid=getSession();
      if(sid&&(sid==='__m'||DB.users.some(u=>u.id===sid)))me=sid;else setSession(null);
      return render();
    }
    if(str===_lastPush)return;
    if(me&&me!=='__m'&&!DB.users.some(u=>u.id===me)){me=null;setSession(null)}
    if(document.querySelector('.ov'))return;
    render();
  },(err)=>{
    $('#app').innerHTML='<div class="center"><div class="card"><h3>No se pudieron leer los datos</h3><p class="mu">Firebase está bloqueando el acceso. En la consola de Firebase activa el inicio de sesión <b>Anónimo</b> (Authentication) y en Realtime Database &gt; Reglas usa:</p><pre class="prev">{\n  "rules": {\n    "ctrlop": {\n      ".read": "auth != null",\n      ".write": "auth != null"\n    }\n  }\n}</pre><p class="mu">Luego pulsa <b>Publicar</b> y recarga esta página.</p><p class="mu" style="font-size:11px">Detalle: '+(window.__fbAuthErr?('inicio anónimo falló ('+window.__fbAuthErr+')'):('reglas de la base de datos ('+((err&&err.code)||'permiso denegado')+')'))+'</p></div></div>';
  });
}
if(window.__fbReady)boot();else window.addEventListener('fbready',boot,{once:true});
